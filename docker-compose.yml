services:
  api:
    image: networthlens
    restart: on-failure:3
    # command: ["gunicorn", "-c", "gunicorn.conf.py", "manage:app"]
    env_file: .env.prod
    environment:
      APP_ENV: production
      RUN_MIGRATIONS: "1"
    volumes:
      - /data/logs/networthlens:/data/logs/networthlens
      - /data/resource/networthlens:/data/resource/networthlens
      - /data/db:/data/db
    ports:
      - "9000:5555"

  celery_worker:
    image: networthlens
    restart: on-failure:3
    env_file: .env.prod
    command: celery -A make_celery.celery_app worker -c 2 -l INFO -f /data/logs/worker.networthlens.log
    depends_on:
      - api

  celery_beat:
    image: networthlens
    restart: on-failure:3
    env_file: .env.prod
    command: celery -A make_celery.celery_app beat -l INFO -f /data/logs/beat.networthlens.log
    volumes:
      - /data/resource/networthlens:/data/resource/networthlens
    depends_on:
      - api
